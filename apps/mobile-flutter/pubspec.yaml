name: toptop_flutter
description: "ViFarm - Agricultural Video & Commerce Ecosystem"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_database: ^12.0.0

  # State Management
  flutter_riverpod: ^2.6.1
  collection: ^1.18.0

  # Navigation
  go_router: ^15.1.2

  # UI
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  video_player: ^2.8.2
  visibility_detector: ^0.4.0+2
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  google_generative_ai: ^0.3.0
  http: ^1.2.0
  google_sign_in: ^6.2.1
  url_launcher: ^6.2.5
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/vifarm.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/vifarm.png"
    background_color: "#121212"
    theme_color: "#121212"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
