<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>
  <style>
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #64748b; }
    .node-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; }
    .node-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; }
    .math-text { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 13px; }
    .badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: 700; text-anchor: middle; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff" rx="12" />
  
  <text x="40" y="45" class="title">SƠ ĐỒ USE CASE HỆ THỐNG GỢI Ý VIDEO TOPTOP (UML 2.5)</text>
  <text x="40" y="70" class="subtitle">Phân định ranh giới tác nhân (Actors) và các ca sử dụng khuyến nghị nông sản</text>

  <!-- Actors -->
  <g transform="translate(40, 110)">
    <!-- Consumer Actor -->
    <rect width="160" height="70" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2" filter="url(#shadow)" />
    <text x="80" y="28" fill="#1e1b4b" class="node-title" text-anchor="middle">👤 Người Xem</text>
    <text x="80" y="48" fill="#4338ca" class="node-desc" text-anchor="middle">(Consumer / Buyer)</text>

    <!-- Farmer Actor -->
    <rect y="100" width="160" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)" />
    <text x="80" y="128" fill="#78350f" class="node-title" text-anchor="middle">👨‍🌾 Nông Hộ</text>
    <text x="80" y="148" fill="#b45309" class="node-desc" text-anchor="middle">(Farmer / Creator)</text>

    <!-- AI Engine Actor -->
    <rect y="200" width="160" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)" />
    <text x="80" y="228" fill="#064e3b" class="node-title" text-anchor="middle">🧠 Động Cơ AI</text>
    <text x="80" y="248" fill="#047857" class="node-desc" text-anchor="middle">(RecSys Engine)</text>
  </g>

  <!-- System Boundary -->
  <g transform="translate(260, 90)">
    <rect width="480" height="340" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <text x="240" y="25" fill="#475569" class="badge" font-size="11">HỆ THỐNG KHUYẾN NGHỊ TOPTOP (VIFARM ECOSYSTEM)</text>

    <!-- Use cases -->
    <rect x="40" y="45" width="220" height="40" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="150" y="70" fill="#1e3a8a" class="node-desc" font-weight="600" text-anchor="middle">UC01: Lướt Feed Video Vô Tận</text>

    <rect x="40" y="105" width="220" height="40" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="150" y="130" fill="#1e3a8a" class="node-desc" font-weight="600" text-anchor="middle">UC02: Ghi Nhận Tương Tác Hành Vi</text>

    <rect x="40" y="165" width="220" height="40" rx="20" fill="#ffffff" stroke="#d97706" stroke-width="1.5" />
    <text x="150" y="190" fill="#78350f" class="node-desc" font-weight="600" text-anchor="middle">UC03: Tải Lên Video Canh Tác Mới</text>

    <rect x="40" y="225" width="220" height="40" rx="20" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
    <text x="150" y="250" fill="#064e3b" class="node-desc" font-weight="600" text-anchor="middle">UC04: Gợi Ý Danh Sách Top-K Cá Nhân</text>

    <rect x="40" y="285" width="220" height="40" rx="20" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
    <text x="150" y="310" fill="#064e3b" class="node-desc" font-weight="600" text-anchor="middle">UC05: Khử Thiên Lệch Nhân Quả</text>

    <!-- Included / Extended -->
    <rect x="300" y="130" width="160" height="36" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="1" />
    <text x="380" y="152" fill="#334155" class="badge">UC06: Khởi Động Lạnh</text>
    
    <path d="M 260 245 L 300 155" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrow)" />
    <text x="310" y="210" fill="#64748b" font-size="9">&lt;&lt;extend&gt;&gt;</text>
  </g>

  <!-- Connectors -->
  <path d="M 200 145 L 300 155" fill="none" stroke="#2563eb" stroke-width="2" />
  <path d="M 200 145 L 300 215" fill="none" stroke="#2563eb" stroke-width="2" />
  <path d="M 200 245 L 300 275" fill="none" stroke="#d97706" stroke-width="2" />
  <path d="M 200 345 L 300 335" fill="none" stroke="#059669" stroke-width="2" />
  <path d="M 200 345 L 300 395" fill="none" stroke="#059669" stroke-width="2" />

</svg>