<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" width="950" height="360">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>
  <style>
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #64748b; }
    .node-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; }
    .node-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff" rx="10" />

  <text x="30" y="35" class="title">CƠ CHẾ ƯỚC LƯỢNG KỲ VỌNG KÉP &amp; BỘ LỌC PHƯƠNG SAI TRONG CDR (CIKM 2023)</text>
  <text x="30" y="55" class="subtitle">Kiểm soát hiện tượng bùng nổ phương sai của IPS bằng ngưỡng phương sai động τ</text>

  <!-- Input Data -->
  <g transform="translate(30, 110)">
    <rect width="170" height="80" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#shadow)" />
    <text x="85" y="30" fill="#0f172a" class="node-title" text-anchor="middle">Dữ Liệu Quan Sát</text>
    <text x="85" y="48" fill="#64748b" class="node-desc" text-anchor="middle">D_obs = {(u, i): O_ui = 1}</text>
    <text x="85" y="66" fill="#475569" font-size="10" text-anchor="middle">Tương tác nhị phân</text>
  </g>

  <!-- Propensity Model -->
  <g transform="translate(260, 90)">
    <rect width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)" />
    <text x="100" y="26" fill="#1e3a8a" class="node-title" text-anchor="middle">Mô Hình Xu Hướng p_ui</text>
    <text x="100" y="45" fill="#1d4ed8" class="node-desc" text-anchor="middle">Propensity Model (Naive Bayes / NCF)</text>
  </g>

  <!-- Imputation Model -->
  <g transform="translate(260, 180)">
    <rect width="200" height="60" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" filter="url(#shadow)" />
    <text x="100" y="26" fill="#581c87" class="node-title" text-anchor="middle">Mô Hình Điền Khuyết m_ui</text>
    <text x="100" y="45" fill="#7e22ce" class="node-desc" text-anchor="middle">Error Imputation Model (MC Dropout)</text>
  </g>

  <!-- Variance Filter -->
  <g transform="translate(520, 90)">
    <rect width="180" height="60" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)" />
    <text x="90" y="26" fill="#92400e" class="node-title" text-anchor="middle">Bộ Lọc Phương Sai</text>
    <text x="90" y="45" fill="#b45309" class="node-desc" text-anchor="middle">Điều kiện: Var_ui &lt; τ</text>
  </g>

  <!-- Doubly Robust Loss -->
  <g transform="translate(740, 120)">
    <rect width="180" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.5" filter="url(#shadow)" />
    <text x="90" y="28" fill="#064e3b" class="node-title" text-anchor="middle">HÀM MẤT MÁT L_DR</text>
    <text x="90" y="48" fill="#047857" class="node-desc" text-anchor="middle">Ước lượng kỳ vọng kép</text>
    <text x="90" y="66" fill="#065f46" font-size="10" font-weight="700" text-anchor="middle">Khử thiên lệch không chệch</text>
    <text x="90" y="80" fill="#059669" font-size="9" text-anchor="middle">Kiểm soát phương sai cực tiểu</text>
  </g>

  <!-- Connecting paths -->
  <path d="M 200 135 L 260 120" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 200 165 L 260 210" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 460 120 L 520 120" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 700 120 L 740 150" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" />
  <path d="M 460 210 L 740 180" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Formula Box bottom -->
  <g transform="translate(100, 280)">
    <rect width="750" height="55" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="375" y="24" fill="#334155" font-family="'Cambria Math', serif" font-size="12" text-anchor="middle">
      Var_ui = [(1 - p_ui) / p_ui^2] * (ℒ_ui - m_ui)^2  &lt;  τ  ⇒  Bảo vệ kép triệt tiêu bù đắp độc hại
    </text>
    <text x="375" y="43" fill="#64748b" font-size="10" text-anchor="middle">
      Khi phương sai bùng nổ, mẫu tương tác được hạ trọng số về IPS thuần để bảo đảm hội tụ ổn định
    </text>
  </g>
</svg>
